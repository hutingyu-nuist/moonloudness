name: MoonBit checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: strict-${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    env:
      MOONBIT_INSTALL_DEV: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up pinned MoonBit compiler and core
        uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - name: Show toolchain and native compiler
        run: |
          moon version --all
          cc --version
      - name: Validate generated interfaces and formatting
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
          moon fmt --check
      - name: Strict target check, release build and tests
        run: |
          moon check --deny-warn --target ${{ matrix.target }}
          moon build --deny-warn --release --target ${{ matrix.target }}
          moon test --deny-warn --target ${{ matrix.target }}
          moon test --deny-warn --release --target ${{ matrix.target }}
      - name: Run downstream workflows
        run: |
          moon run examples/mono --target ${{ matrix.target }}
          moon run examples/stereo --target ${{ matrix.target }}
          moon run examples/surround --target ${{ matrix.target }}
          moon run examples/batch --target ${{ matrix.target }}

  independent-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MOONBIT_INSTALL_DEV: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - name: Install independent test tool
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate controllers, repository audit and independent PCM measurements
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          python3 tools/audit_delivery.py --strict
          python3 tools/validate_reference.py
